<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Appointments · Meridian Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { ink:'#14232B', teal:'#0B5D52', tealdark:'#083F38', tealtint:'#E7F2F0', clay:'#C2694B', claytint:'#F5E7E1', paper:'#FAF9F6', slate:'#5B6B6E', line:'#E4E1DA' },
      fontFamily: { serif:['Lora','serif'], sans:['Inter','sans-serif'] }
    } }
  }
</script>
<style>
  body{font-family:'Inter',sans-serif;}
  h1,h2,h3,.font-serif{font-family:'Lora',serif;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#C9C4B8;border-radius:4px;} ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body class="bg-paper text-ink">
<div class="flex min-h-screen">
  <div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-200 lg:translate-x-0 lg:static bg-ink text-white/90 flex flex-col py-6 px-4">
    <div class="flex items-center gap-2 px-2 mb-8">
      <div class="w-9 h-9 rounded-md bg-teal flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5 text-white"><path d="M12 3v6M9 6h6M7 9h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 14.5h3M12 13v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div>
        <p class="font-serif text-lg leading-none text-white">Meridian Care</p>
        <p class="text-[11px] text-white/50 tracking-wide mt-1">Admin Console</p>
      </div>
    </div>
    <nav class="flex-1 space-y-1">
      <a th:href="@{/admin/dashboard}" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <svg viewBox="0 0 24 24" fill="none" class="w-4.5 h-4.5"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        Dashboard
      </a>
      <a th:href="@{/admin/appointments}" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium bg-teal/20 text-white border-l-2 border-teal">
        <svg viewBox="0 0 24 24" fill="none" class="w-4.5 h-4.5"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Appointments
      </a>
      <a th:href="@{/admin/users}" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <svg viewBox="0 0 24 24" fill="none" class="w-4.5 h-4.5"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 8.5a2.5 2.5 0 1 0 0-5M18 14.2c1.8.5 3 1.9 3 3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Users
      </a>
    </nav>
    <div class="pt-4 border-t border-white/10">
      <form th:action="@{/logout}" method="post">
        <button type="submit"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white transition-colors">
          <svg viewBox="0 0 24 24" fill="none" class="w-4.5 h-4.5">
            <path d="M15 17l5-5-5-5M20 12H9M13 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
          Sign out
        </button>
      </form>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="flex items-center justify-between gap-4 px-6 py-4 border-b border-line bg-white/70 backdrop-blur sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-ink">
          <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div>
          <h1 class="text-2xl text-ink">Appointments</h1>
          <p class="text-sm text-slate">Review, confirm, and manage bookings across all departments.</p>
        </div>
      </div>
    </header>

    <main class="p-6 space-y-5">

      <!-- Filters -->
      <form th:action="@{/admin/appointments}" method="get" class="bg-white rounded-lg border border-line p-4 flex flex-wrap items-end gap-3">
        <div class="flex-1 min-w-[180px]">
          <label class="block text-xs font-medium text-slate mb-1">Search patient or doctor</label>
          <input type="text" name="query" placeholder="e.g. Riya Sharma" th:value="${param.query}"
                 class="w-full px-3 py-2 rounded-md border border-line text-sm focus:outline-none focus:ring-2 focus:ring-teal/40 focus:border-teal" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate mb-1">Status</label>
          <select name="status" class="px-3 py-2 rounded-md border border-line text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal/40">
            <option value="">All</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="PENDING">Pending</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate mb-1">Date</label>
          <input type="date" name="date" class="px-3 py-2 rounded-md border border-line text-sm focus:outline-none focus:ring-2 focus:ring-teal/40" />
        </div>
        <button type="submit" class="px-4 py-2 rounded-md bg-teal text-white text-sm font-medium hover:bg-tealdark transition-colors">Filter</button>
      </form>

      <!-- Table -->
      <div class="bg-white rounded-lg border border-line overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-slate border-b border-line bg-paper/60">
              <th class="px-5 py-3 font-medium">Patient</th>
              <th class="px-5 py-3 font-medium">Doctor</th>
              <th class="px-5 py-3 font-medium">Department</th>
              <th class="px-5 py-3 font-medium">Date</th>
              <th class="px-5 py-3 font-medium">Time</th>
              <th class="px-5 py-3 font-medium">Status</th>
              <th class="px-5 py-3 font-medium text-right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="appt : ${appointments}" class="border-b border-line last:border-0 hover:bg-paper/60">
              <td class="px-5 py-3.5 font-medium text-ink"
                  th:text="${appt.patient != null ? appt.patient.name : 'N/A'}">
              </td>

              <td class="px-5 py-3.5"
                  th:text="${appt.doctor != null ? appt.doctor.name : 'N/A'}">
              </td>

              <td class="px-5 py-3.5 text-slate">
                -
              </td>

              <td class="px-5 py-3.5"
                  th:text="${#temporals.format(appt.startTime,'dd MMM yyyy')}">
              </td>

              <td class="px-5 py-3.5"
                  th:text="${#temporals.format(appt.startTime,'hh:mm a')}">
              </td>
              <td class="px-5 py-3.5">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
                      th:classappend="${appt.status == 'CONFIRMED'} ? 'bg-tealtint text-tealdark' : (${appt.status == 'PENDING'} ? 'bg-claytint text-clay' : 'bg-line text-slate')"
                      th:text="${appt.status}">Confirmed</span>
              </td>
              <td class="px-5 py-3.5 text-right space-x-2 whitespace-nowrap">
                <form th:action="@{'/admin/appointments/' + ${appt.id} + '/confirm'}" method="post" class="inline">
                  <button type="submit" class="text-teal text-xs font-medium hover:underline">Confirm</button>
                </form>
                <form th:action="@{'/admin/appointments/' + ${appt.id} + '/cancel'}" method="post" class="inline">
                  <button type="submit" class="text-clay text-xs font-medium hover:underline">Cancel</button>
                </form>
              </td>
            </tr>
            <tr th:if="${appointments == null or #lists.isEmpty(appointments)}">
              <td colspan="7" class="px-5 py-10 text-center text-slate">No appointments match your filters.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script>
  function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('overlay').classList.toggle('hidden');
  }
</script>
</body>
</html>
