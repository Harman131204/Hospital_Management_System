<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Calendar · Meridian Care</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

        const calendarEl = document.getElementById('calendar');

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 'auto',

            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },

            events: {
                url: '/appointment/events',
                failure: function () {
                    alert('Failed to load appointments');
                }
            },

            eventColor: '#0B5D52',
            eventTextColor: '#ffffff',

            nowIndicator: true,
            navLinks: true,
            editable: false,
            dayMaxEvents: true
        });

        calendar.render();
    });
  </script>

  <style>
    body {
        font-family: 'Inter', sans-serif;
    }

    h1, h2, h3, .font-serif {
        font-family: 'Lora', serif;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b shadow-sm">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-md bg-teal-700 flex items-center justify-center text-white">
        🏥
      </div>

      <div>
        <h2 class="text-xl font-semibold">
          Meridian Care
        </h2>
        <p class="text-xs text-gray-500">
          Appointment Calendar
        </p>
      </div>
    </div>

    <a th:href="${dashboardUrl}"
       class="text-sm font-medium text-gray-600 hover:text-black transition">
      ← Back to Dashboard
    </a>

  </div>
</header>

<main class="max-w-7xl mx-auto p-6">

  <div class="mb-6">
    <h1 class="text-3xl font-bold font-serif">
      Appointment Calendar
    </h1>

    <p class="text-gray-600 mt-2">
      View and manage all scheduled appointments.
    </p>
  </div>

  <div class="bg-white rounded-xl shadow-sm border p-5">
    <div id="calendar"></div>
  </div>

</main>

</body>
</html>
